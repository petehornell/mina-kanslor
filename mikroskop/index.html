<!doctype html>
<html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Mikroskopets delar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf4f6;color:#16333e;font:18px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:clamp(28px,5vw,40px);margin:4px 0}p{margin:8px 0 18px}button{font:inherit;border:2px solid #bfd1d7;border-radius:12px;background:white;color:inherit;padding:12px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #f6b642;outline-offset:3px}button.active,button.primary{background:#176a78;color:white;border-color:#176a78}nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border-radius:20px;padding:20px;box-shadow:0 3px 15px #16333e0b}.drawing{padding:8px}svg{width:100%;max-height:570px}svg .part{fill:#dce6e9;stroke:#334e58;stroke-width:3}svg .mark{cursor:pointer}svg .mark circle{fill:#176a78;stroke:white;stroke-width:3}svg .mark text{fill:white;font:bold 19px system-ui;text-anchor:middle;dominant-baseline:central;pointer-events:none}svg .mark.selected circle{fill:#be5b11;stroke:#ffda86;stroke-width:5}.answers{display:grid;gap:9px}.answers button{text-align:left;font-size:17px}#feedback{min-height:64px;padding:12px 0;font-weight:600}.correct{background:#e0f5e7!important;border-color:#25814a!important}.wrong{background:#fff0df!important;border-color:#b86618!important}progress{width:100%;height:16px;accent-color:#176a78}.small{font-size:15px;color:#4c6873}#hint{background:#edf4f6;padding:12px;border-radius:10px}#next{width:100%}@media(max-width:650px){main{padding:12px}.layout{grid-template-columns:1fr;gap:12px}.card{padding:15px}.drawing svg{max-height:350px}nav button{flex:1}.answers{grid-template-columns:1fr 1fr}.answers button{font-size:15px;padding:10px;overflow-wrap:anywhere}h2{font-size:23px;margin:6px 0}}
</style>
<main><div class="small">NO · Träna i din egen takt</div><h1>Mikroskopets delar</h1><p>Lär dig nio delar. Välj namnet som passar till den orange markeringen.</p>
<nav aria-label="Välj läge"><button id="learn" class="active">Träna</button><button id="test">Testa dig</button><button id="restart">Börja om</button></nav>
<div class="layout"><section class="card drawing" aria-label="Skiss av ett mikroskop">
<svg viewBox="0 0 480 540" role="img" aria-labelledby="st sd"><title id="st">Mikroskop med nio numrerade delar</title><desc id="sd">Ett monokulärt mikroskop. Numren motsvarar delarna i övningen.</desc>
<g class="part">
<path d="M120 450 L340 420 410 472 410 510 120 520 60 487 60 456Z"/>
<path d="M310 430V190L220 160 230 130 350 170V440Z"/>
<path d="M175 151L268 35 293 55 208 174Z"/><path d="M263 40L277 20Q284 15 303 31L295 55Z" fill="#738e99"/>
<path d="M120 140L183 119 245 162 239 199 160 218 116 190Z"/>
<path d="M161 211L236 193 249 216 171 239Z" fill="#738e99"/>
<path d="M172 232L153 266 168 279 193 242Z"/><path d="M201 231L192 284 216 289 226 228Z"/><path d="M230 222L238 273 258 269 253 215Z"/>
<path d="M94 305L267 279 330 307 151 343 94 327Z"/><path d="M145 301L210 291 233 303 165 316Z" fill="white"/>
<ellipse cx="211" cy="341" rx="44" ry="12"/><path d="M175 343L130 354 131 364 178 353Z"/>
<circle cx="349" cy="288" r="30"/><circle cx="349" cy="288" r="22" fill="#a8bdc5"/>
<circle cx="332" cy="378" r="15"/><circle cx="332" cy="378" r="8" fill="#a8bdc5"/>
<path d="M172 438V400H253V438Q212 461 172 438Z"/><ellipse cx="212" cy="400" rx="40" ry="15"/><ellipse cx="212" cy="400" rx="26" ry="8" fill="white"/>
</g><g id="markers"></g></svg></section>
<section class="card"><div id="status" class="small"></div><progress id="progress" max="9" value="0" aria-label="Antal besvarade delar"></progress><h2 id="question"></h2><p id="hint"></p><button id="speak" style="margin-bottom:12px">🔊 Läs upp</button><div class="answers" id="answers"></div><div id="feedback" role="status" aria-live="polite"></div><button id="next" class="primary" hidden>Nästa del →</button></section></div><p class="small" style="margin-top:20px">Preparat är det som undersöks, vanligtvis på ett objektglas. Skissen visar ett exempel; mikroskop kan se olika ut. Inga svar skickas eller sparas.</p></main>
<script>
const parts=[
['Okular','Här tittar du in i mikroskopet.',[300,22]],
['Objektivrevolver','Den vrids för att byta objektiv.',[132,222]],
['Objektiv','Linser nära preparatet. Olika objektiv ger olika förstoring.',[267,252]],
['Preparat','Det som ska undersökas. Här ligger det på ett objektglas.',[149,285]],
['Objektbord','Bordet där objektglaset ligger.',[92,320]],
['Bländare','Reglerar ljusöppningen under objektbordet.',[113,365]],
['Ljuskälla','Lyser upp preparatet underifrån.',[167,419]],
['Grovinställningsskruv','Den stora skruven används för grov fokusering.',[391,286]],
['Fininställningsskruv','Den lilla skruven används för noggrann fokusering.',[370,380]]
];
const $=id=>document.getElementById(id);let mode='learn',order=[],at=0,score=0,locked=false,first=true;
const shuffle=a=>a.slice().sort(()=>Math.random()-.5);
parts.forEach((p,i)=>{let g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','mark');g.id='mark'+i;g.innerHTML='<line x1="'+p[2][0]+'" y1="'+p[2][1]+'" x2="'+[[285,37],[192,220],[245,257],[185,301],[127,323],[150,355],[201,420],[349,288],[332,378]][i][0]+'" y2="'+[[285,37],[192,220],[245,257],[185,301],[127,323],[150,355],[201,420],[349,288],[332,378]][i][1]+'" stroke="#176a78" stroke-width="2"/><circle cx="'+p[2][0]+'" cy="'+p[2][1]+'" r="18"/><text x="'+p[2][0]+'" y="'+p[2][1]+'">'+(i+1)+'</text>';$('markers').append(g)});
function start(m){mode=m;order=m==='test'?shuffle(parts.map((_,i)=>i)):parts.map((_,i)=>i);at=0;score=0;$('learn').classList.toggle('active',m==='learn');$('test').classList.toggle('active',m==='test');show()}
function show(){locked=false;first=true;$('next').hidden=true;$('feedback').textContent='';$('progress').value=at;document.querySelectorAll('.mark').forEach(g=>g.classList.remove('selected'));
if(at===9){$('question').textContent=mode==='test'?score+' av 9 rätt på första försöket':'Alla nio delar är tränade!';$('status').textContent='Klart';$('hint').hidden=false;$('hint').textContent=score===9?'Du satte alla på första försöket!':'Varje övning hjälper. Ta gärna en runda till.';$('answers').replaceChildren();$('speak').hidden=true;$('next').hidden=false;$('next').textContent='Kör en gång till';$('progress').value=9;return}
let i=order[at];$('mark'+i).classList.add('selected');$('status').textContent=(mode==='test'?'Test':'Träning')+' · '+(at+1)+' av 9';$('question').textContent='Vad heter del '+(i+1)+'?';$('hint').hidden=mode==='test';$('hint').textContent=parts[i][1];$('speak').hidden=mode==='test';$('next').textContent='Nästa del →';$('answers').replaceChildren();shuffle(parts.map((_,j)=>j)).forEach(j=>{let b=document.createElement('button');b.textContent=parts[j][0];b.onclick=()=>answer(j,b);$('answers').append(b)})}
function answer(j,b){if(locked)return;let i=order[at];if(j===i){if(first)score++;locked=true;b.classList.add('correct');$('feedback').textContent='Rätt! '+parts[i][0]+'. '+parts[i][1];$('next').hidden=false;document.querySelectorAll('#answers button').forEach(x=>x.disabled=true)}
else if(mode==='learn'){first=false;b.classList.add('wrong');b.disabled=true;$('feedback').textContent='Inte riktigt. Läs ledtråden och försök igen.'}
else{locked=true;b.classList.add('wrong');document.querySelectorAll('#answers button').forEach(x=>{x.disabled=true;if(x.textContent===parts[i][0])x.classList.add('correct')});$('feedback').textContent='Rätt svar: '+parts[i][0]+'. '+parts[i][1];$('next').hidden=false}}
$('next').onclick=()=>{if(at===9)start(mode);else{at++;show()}};
$('learn').onclick=()=>start('learn');$('test').onclick=()=>start('test');$('restart').onclick=()=>start(mode);
$('speak').onclick=()=>{if(!('speechSynthesis'in window)){$('feedback').textContent='Uppläsning stöds inte i den här webbläsaren.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(parts[order[at]][0]+'. '+parts[order[at]][1]);u.lang='sv-SE';u.rate=.85;speechSynthesis.speak(u)};start('learn');
</script></html>
